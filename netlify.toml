# Netlify settings for the Preamble election site
[build]
  publish = "."

# photos, logos and fonts rarely change: let browsers keep them for a week
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# code and styles: check for a newer version on every visit, so pushed edits show up straight away
# (unchanged files come back as a tiny "not modified" reply, so this stays fast)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# results and tracker data update live: always check for a newer version
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
