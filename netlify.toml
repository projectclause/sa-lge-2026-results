# Netlify settings for the Preamble election site
[build]
  publish = "."

# Every page, script, style, data file and image is checked for a newer version on each visit, so a
# refresh after a deploy always shows the latest. Unchanged files come back as a tiny "not modified"
# reply (Netlify sends an ETag), so this stays fast.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

