# Keeps the Coalitions Tracker current every hour, with no one touching it.
#   1. tools/auto-update.rb finds new coalition coverage and writes data/coalition-auto.json
#      (new pieces by the voices and key players, new reports, new stories). It never edits data/coalition-feed.json.
#      tools/youtube-tv.rb refreshes the YouTube TV view counts and ranking (data/youtube-tv.json).
#      tools/saffa-news.rb refreshes the latest articles about SAFFA's Key South Africans (data/saffa-key-news.json).
#   2. tools/build-seo.rb rebuilds the static story pages, profiles, sitemap and llms.txt from both files.
#   3. If anything changed, the files are committed to main; Netlify publishes the push within a minute or two.
#   4. Search engines that use IndexNow (Bing, which also feeds ChatGPT search and Copilot) are told which pages changed.
# Run it by hand: GitHub > Actions > "Coalitions Tracker hourly update" > Run workflow.
name: Coalitions Tracker hourly update

on:
  schedule:
    - cron: "17 * * * *" # every hour at :17 (GitHub may start it a few minutes late when busy)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coalitions-auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install the Claude library (only used when the ANTHROPIC_API_KEY secret is set)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then gem install anthropic --no-document; else echo "No ANTHROPIC_API_KEY secret: using the simple rules"; fi

      - name: Find new coverage
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ruby tools/auto-update.rb

      - name: Latest news about SAFFA's Key South Africans
        continue-on-error: true
        run: ruby tools/saffa-news.rb

      - name: YouTube TV view counts
        continue-on-error: true
        run: ruby tools/youtube-tv.rb

      - name: Madlanga Commission tracker (trusted outlets only, quoted and credited)
        continue-on-error: true
        run: ruby tools/madlanga-update.rb

      - name: Coalitions Tracker right of reply (key players' published responses)
        continue-on-error: true
        run: ruby tools/coalition-replies.rb

      - name: Mayor watch (switches the home page when Mashaba is elected)
        continue-on-error: true
        run: ruby tools/mayor-watch.rb

      - name: Rebuild story pages, profiles and sitemap
        run: ruby tools/build-seo.rb

      - name: Publish if anything changed
        id: commit
        run: |
          git add -A data/coalition-auto.json data/saffa-key-news.json data/youtube-tv.json data/mayors-elected.json data/madlanga-auto.json data/madlanga-log.json data/coalition-replies.json coalitions coalitions.html people sitemap.xml llms.txt index.html mayors.html
          if git diff --cached --quiet; then echo "Nothing new this hour."; echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git diff --cached --name-only -- 'coalitions/*.html' 'people/*.html' | sed 's#^#https://preamble.co.za/#' > /tmp/changed-urls.txt
          git config user.name "preamble-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Coalitions Tracker: hourly update $(TZ=Africa/Johannesburg date '+%-d %b %H:%M') SAST"
          # someone may have pushed a hand edit while this ran: put this update on top of it
          for n in 1 2 3; do
            if git push origin HEAD:main; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin main || { git rebase --abort; git reset --hard origin/main; ruby tools/auto-update.rb; ruby tools/mayor-watch.rb || true; ruby tools/madlanga-update.rb || true; ruby tools/coalition-replies.rb || true; ruby tools/build-seo.rb; git add -A data/coalition-auto.json data/saffa-key-news.json data/youtube-tv.json data/mayors-elected.json data/madlanga-auto.json data/madlanga-log.json data/coalition-replies.json coalitions coalitions.html people sitemap.xml llms.txt index.html mayors.html; git commit -m "Coalitions Tracker: hourly update (rebuilt)" || exit 0; }
            sleep 5
          done
          exit 1

      - name: Tell search engines which pages changed
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        run: |
          [ -s /tmp/changed-urls.txt ] || exit 0
          sleep 150 # give Netlify time to publish first
          ruby tools/indexnow.rb https://preamble.co.za/coalitions.html $(head -n 200 /tmp/changed-urls.txt)
