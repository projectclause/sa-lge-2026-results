# Records the same short news paragraph in several Microsoft Azure voices (tools/voice-samples.rb) so the Listen bar's
# voice can be chosen by ear on preamble.co.za/voices.html. Run by hand: GitHub > Actions > "Listen voice samples".
name: Listen voice samples

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Record the samples
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: ruby tools/voice-samples.rb
      - name: Publish them
        run: |
          git add -A audio/samples data/voice-samples.json
          if git diff --cached --quiet; then echo "Nothing recorded."; exit 0; fi
          git config user.name "preamble-tracker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Listen voice samples"
          for n in 1 2 3; do git push origin HEAD:main && exit 0; git pull --rebase origin main; sleep 5; done
          exit 1
